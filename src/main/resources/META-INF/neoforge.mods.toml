modLoader = "javafml"
loaderVersion = "${loader_version}"
license = "LGPLv3"
issueTrackerURL = "https://github.com/eszn/FemaleGenderMod-Extended/issues"

[[mods]]
    modId = "wildfire_gender"
    version = "${file.jarVersion}"
    displayName = "Female Gender Extended"
    #updateJSONURL="https://change.me.example.invalid/updates.json"
    displayURL = "https://github.com/eszn/FemaleGenderMod-Extended"
    logoFile = "assets/wildfire_gender/icon.png"
    credits = "A2 76, Arcti_cc, BluelightAmelia, celeste, diademiemi, IzzyBizzy45, Kichura, PinguinLars, Powerless001, pupnewfster, RacoonDog"
    authors = "WildfireRomeo"
    description = "Independent NeoForge 1.21.1 fork: rounded models, conservative body shaping, damped secondary motion and multiplayer sync."
    displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
    config = "wildfire_gender.mixins.json"

[[dependencies.wildfire_gender]]
    modId = "minecraft"
    type = "required"
    versionRange = "${mc_version}"
    side = "BOTH"
[[dependencies.wildfire_gender]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version}"
    side = "BOTH"
